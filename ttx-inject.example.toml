# ttx-inject: the SDI side. Runs on the host with the DeckLink card.
# ttxd's injector link (inject_listen in ttxd.toml).
ttxd = "192.168.3.94:4243"
# Without this, a 50 Hz timer stands in and nothing goes to SDI (for testing).
decklink_device = "DeckLink Duo (2)"
vanc_line = 9
# OP-47 packets per frame, 1-3, 5 teletext lines each, on VANC lines vanc_line,
# vanc_line + 1, ... More than 1 needs the encoding appliance in its multi-packet mode.
op47_packets = 1
# Wrap each OP-47 packet in an ANC Multipacket (SDID 0x03), for an encoder set to its
# "multi-packet" OP-47 mode. A multipacket holds one 5-line SDP.
op47_multipacket = false
# Mark every other frame's lines as second field (descriptor bit 7 clear), so an encoder
# that groups two 50p frames into one 625-line frame sees each line/field once.
op47_alternate_fields = false
# Line numbers in the OP-47 descriptors, 5 per packet. Default: 7 upwards.
# op47_lines = [7, 8, 9, 10, 11]
# Frames asked for ahead of the card; each is 20 ms of delay.
buffer_frames = 2
# After this long without frames from ttxd, replay the last full carousel cycle.
replay_after_ms = 500
max_cycle_secs = 120
