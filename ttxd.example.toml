listen = "0.0.0.0:8080"
# Raw T42 packets (42 bytes each) for debugging, e.g. `nc host 4242 > dump.t42`.
t42_listen = "127.0.0.1:4242"
# Public read-only feed for the web viewer (GET /teletext/feed, Server-Sent Events).
# Expose this one through the public ingress, never the API port.
public_listen = "0.0.0.0:8081"
snapshot = "/var/lib/ttxd/pages.json"
service_name = "FRIKANALEN"
# Packet 8/30: first page decoders show, and the network identification code (0 = none).
initial_page = "100"
network_id = 0
# ttx-inject (on the SDI host) connects here and asks for each frame.
inject_listen = "0.0.0.0:4243"

[[publisher]]
name = "schedule"
token = "change-me"
pages = ["200-29F"]
# May set the 8/30 status display to the programme on air.
status_display = true
flash_per_sec = 100

[[publisher]]
name = "subtitles"
token = "change-me-too"
# Or read it from the environment instead (e.g. a Kubernetes Secret):
# token_env = "TTXD_TOKEN_SUBTITLES"
pages = ["888"]
subtitles = true

# The studio page generator in generator/ (index on 100).
[[publisher]]
name = "studio"
token = "change-me-studio"
pages = ["100-1FF"]
flash_per_sec = 50
