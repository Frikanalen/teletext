name: Image
# Builds the ttx-pages container image (generator/Dockerfile). Pull requests
# only build it; main pushes ghcr.io/frikanalen/ttx-pages:latest and :sha-...,
# and a release (called from release.yml) also pushes the version tag.
on:
  push:
    branches: [main]
    paths: ["generator/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["generator/**", ".github/workflows/image.yml"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/frikanalen/ttx-pages
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: generator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
