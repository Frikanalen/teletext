name: Release
# release-please keeps a release PR open from the conventional commits on
# main. Merging that PR tags vX.Y.Z, creates the GitHub release, and the
# build job attaches a ttxd binary with DeckLink output to it.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Same Ubuntu release as sdi-test1, so the glibc matches.
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$v" = "$TAG" || { echo "tag $TAG but Cargo.toml says $v"; exit 1; }
      - run: cargo test --locked
      # Uses the vendored SDK headers; libDeckLinkAPI.so is loaded at run time.
      - run: cargo build --release --locked --features decklink
      - name: Package
        run: |
          cp target/release/ttxd ttxd-x86_64-linux-gnu
          sha256sum ttxd-x86_64-linux-gnu > ttxd-x86_64-linux-gnu.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ttxd-x86_64-linux-gnu ttxd-x86_64-linux-gnu.sha256 --clobber
