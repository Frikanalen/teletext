name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Uses the vendored SDK headers; libDeckLinkAPI.so is loaded at run time.
      - run: cargo clippy --all-targets --features decklink -- -D warnings
  generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx run ruff format --check .
      - run: pipx run ruff check .
      - run: python -m unittest -v
      - run: python -m teletext_pages.main pages.example.toml --dry-run
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint --strict chart
      - run: helm template teletext chart --set link.service.loadBalancerIP=192.0.2.1 --set public.enabled=true
