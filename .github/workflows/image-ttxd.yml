name: Image (ttxd)
# ttxd's container image, ghcr.io/frikanalen/ttxd. Pull requests only build it.
# Pushes to main publish :main and :sha-<commit>; a release (called from
# release.yml) publishes :vX.Y.Z, which the chart asks for by default.
on:
  push:
    branches: [main]
    paths: &paths
      ["src/**", "shim/**", "build.rs", "Cargo.*", "Dockerfile", ".dockerignore", ".github/workflows/image-ttxd.yml"]
  pull_request:
    paths: *paths
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  ttxd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/frikanalen/ttxd
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && !inputs.tag }}
            type=sha,enable=${{ !inputs.tag }}
            type=raw,value=${{ inputs.tag }},enable=${{ !!inputs.tag }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
