[package]
name = "ttxd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
cc = "1.11.2"

[features]
# DeckLink SDI output. Needs the Desktop Video SDK headers (DECKLINK_SDK_INCLUDE)
# and the Desktop Video driver/runtime on the host.
decklink = []
