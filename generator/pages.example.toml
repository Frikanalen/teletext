# ttx-pages configuration. The token can also come from $TTXD_TOKEN.
ttxd_url = "http://127.0.0.1:8080"
token = "change-me-studio"
api_url = "https://frikanalen.tv/api"
poll_secs = 30
refresh_secs = 120
ttl_secs = 600

[index]
page = "100"
tagline = "Sivilsamfunnets kanal"
footer = "frikanalen.tv"
# The sky follows the sun here, with the weather from MET Norway (api.met.no).
latitude = 59.91
longitude = 10.75
weather = true

# The first four that ttxd is sending (or that have always = true) get a colour key.
[[index.entry]]
page = "200"
title = "Sendeplan"

[[index.entry]]
page = "300"
title = "Info"

[[index.entry]]
page = "888"
title = "Teksting"
always = true

# The programme schedule from now on, a subpage per 8 programmes. This is the page
# to name as "programme schedule page" in the DVB teletext descriptor.
[schedule]
page = "200"

# Information about the channel: the "additional information page". Without sections
# here it carries a short text about Frikanalen.
[info]
page = "300"

