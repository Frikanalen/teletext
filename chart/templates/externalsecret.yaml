{{- if .Values.tokens.externalSecret.enabled }}
# Publisher tokens from OpenBao, one key per publisher (see values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tokens.secretName }}
  labels:
    {{- include "teletext.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.tokens.externalSecret.secretStore }}
  target:
    name: {{ .Values.tokens.secretName }}
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: {{ .Values.tokens.externalSecret.key }}
{{- end }}
