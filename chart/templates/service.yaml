apiVersion: v1
kind: Service
metadata:
  name: ttxd
  labels:
    {{- include "teletext.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "teletext.ttxdSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.public.enabled }}
    - name: public
      port: {{ .Values.public.port }}
      targetPort: public
    {{- end }}
---
# For ttx-inject on the SDI host, outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: ttxd-link
  labels:
    {{- include "teletext.labels" . | nindent 4 }}
spec:
  type: {{ .Values.link.service.type }}
  {{- with .Values.link.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- if eq .Values.link.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    {{- include "teletext.ttxdSelector" . | nindent 4 }}
  ports:
    - name: link
      port: {{ .Values.link.port }}
      targetPort: link
