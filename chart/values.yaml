# One replica only: ttxd owns the frame clock and the page store, and ttx-inject
# talks to exactly one ttxd.
image:
  repository: ghcr.io/frikanalen/ttxd
  # Defaults to v<chart version>.
  tag: ""
  pullPolicy: IfNotPresent

timezone: Europe/Oslo

# ttxd.toml, apart from the listen addresses and publishers below.
config:
  serviceName: FRIKANALEN
  initialPage: "100"
  networkId: 0
  # Hidden pages ttxd builds from the shared Level 2.5 assets (PUT /v1/assets).
  gpopPage: "8E8"
  gdrcsPage: "8E9"

# Publishers and the pages they may write. Each token comes from key `tokenKey` of
# the Secret named in `tokens.secretName`.
publishers:
  - name: pages
    tokenKey: pages
    pages: ["100-7FF"]
    statusDisplay: true
    assets: true
    flashPerSec: 100
  - name: subtitles
    tokenKey: subtitles
    pages: ["888"]
    subtitles: true

tokens:
  secretName: ttxd-tokens
  # Write that Secret from OpenBao with External Secrets Operator. The path holds
  # one key per publisher token.
  externalSecret:
    enabled: true
    secretStore: openbao
    key: staging/teletext/ttxd-tokens

# HTTP API for publishers, inside the cluster.
service:
  type: ClusterIP
  port: 8080

# The link ttx-inject on the SDI host connects to. It is outside the cluster, so
# this is a LoadBalancer with a fixed address.
link:
  port: 4243
  service:
    type: LoadBalancer
    loadBalancerIP: ""

# Read-only public feed (public_listen), when ttxd has it.
public:
  enabled: false
  port: 8081
  # Route https://<hostname>/teletext/ to it, for the live player's teletext button.
  ingress:
    enabled: false
    className: public
    hostname: ""
    certResolver: letsencrypt

persistence:
  size: 1Gi
  storageClass: ""

# The studio page generator (ttx-pages), next to ttxd. It writes as the publisher
# named in `publisher` (its token comes from the same Secret as ttxd's).
pages:
  enabled: false
  image:
    repository: ghcr.io/frikanalen/ttx-pages
    # Defaults to v<chart version>.
    tag: ""
    pullPolicy: IfNotPresent
  publisher: pages
  # django-api's schedule. Production's, from every cluster: teletext shows what is
  # really on air, also on staging.
  apiUrl: https://frikanalen.tv/api
  pollSecs: 30
  refreshSecs: 120
  ttlSecs: 600
  index:
    page: "100"
    tagline: Sivilsamfunnets kanal
    web: frikanalen.tv
    level25: true
    drcsPage: "10F"
    # Listed on the index while ttxd is sending the page, or always with always: true.
    # The first four also go on the colour keys.
    entries:
      - page: "200"
        title: Sendeplan
      - page: "888"
        title: Teksting
        always: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 256Mi
